# ExpenseGauge web: static frontend build, reverse proxy for /api and /mcp.
# Plain HTTP for localhost/LAN; an HTTPS reverse proxy can be put in front later.

# Upgrade/keep-alive handling for proxied requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects (if any) keep the port the browser used, e.g. :8080.
    absolute_redirect off;

    # Batches carry up to 500 items.
    client_max_body_size 4m;

    # Docker's embedded DNS, so a recreated `api` container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API, OpenAPI document and API docs.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_read_timeout 120s;
    }

    # MCP Streamable HTTP. `/mcp` and `/mcp/` both go to the backend unchanged (it serves
    # both without a redirect). No buffering and long timeouts, so streamed responses
    # reach the client as they are produced.
    location ~ ^/mcp/?$ {
        proxy_pass $api_upstream;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # Vite's content-hashed bundles never change under the same name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: unknown paths render index.html; the HTML itself is always revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
